# uv workspace root (ADR-008). Not a package itself; it pins the dev toolchain
# and pulls in the workspace members. Members join per phase:
#   P1: services/ai-backend   P3: packages/vsl-features   P5: ml
[project]
name = "vsl-classroom-assistant"
version = "0.1.0"
description = "Workspace root for VSL Classroom Assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["vsl-backend", "vsl-features", "vsl-ml"]

# Opt-in extras, from the repository root (Windows laptop / CI only):
#   uv run --extra train ...             training + ONNX serving (P5)
#   uv run --extra onnx ...              ONNX serving only
#   uv run --extra server-extraction ... L3 server-side MediaPipe
#   uv run --extra stt ...               P7 speech-to-text (faster-whisper)
# A plain `uv sync` removes them again, so pass the extra every time.
[project.optional-dependencies]
train = ["vsl-ml[train]", "vsl-backend[onnx]"]
onnx = ["vsl-backend[onnx]"]
server-extraction = ["vsl-backend[server-extraction]"]
stt = ["vsl-backend[stt]"]
# Everything the Windows laptop runs: train + serve ONNX + STT.
windows = ["vsl-ml[train]", "vsl-backend[onnx]", "vsl-backend[stt]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "psutil>=6",
    "pillow>=11",  # tests for L3 JPEG decoding
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/ai-backend", "packages/vsl-features", "ml"]

[tool.uv.sources]
vsl-backend = { workspace = true }
vsl-features = { workspace = true }
vsl-ml = { workspace = true }
# CPU-only torch on every OS (the default Linux wheel pulls in CUDA). Only the
# `train` extra needs it: Windows laptop and the CI ML smoke job (ADR-015).
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "services/ai-backend/src",
    "services/ai-backend",
    "packages/vsl-features/src",
    "ml/src",
]
extend-exclude = ["apps/web", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["vsl_backend", "vsl_features", "vsl_ml", "tests"]

[tool.ruff.lint.per-file-ignores]
"services/ai-backend/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "services/ai-backend/src",
    "services/ai-backend/tests",
    "packages/vsl-features/src",
    "packages/vsl-features/tests",
    "ml/src",
    "ml/tests",
    "scripts",
]

[[tool.mypy.overrides]]
module = ["psutil", "mediapipe", "mediapipe.*", "onnxruntime", "onnxruntime.*", "faster_whisper"]
ignore_missing_imports = true

# torch is not installed on the M1 or in the main CI job; without its stubs the
# nn.Module subclasses are `Any` subclasses.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vsl_ml.torch_models", "test_torch_models", "train_sign_model"]
disallow_subclassing_any = false
disallow_any_unimported = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["services/ai-backend/tests", "packages/vsl-features/tests", "ml/tests"]
addopts = "-q"
markers = [
    "windows_hw: needs real models/hardware; runs only on the Windows laptop with VSL_RUN_HW_TESTS=1",
    "train: trains a tiny model on synthetic data; needs the train extra (CI ML job, Windows)",
]
