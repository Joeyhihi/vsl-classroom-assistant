[project]
name = "vsl-features"
version = "0.1.0"
description = "Shared landmark preprocessing, segmentation and decoding (training + serving)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# NumPy only: imported by both the backend and ml/ (ADR-009). Never torch.
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
