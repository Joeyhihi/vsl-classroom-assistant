[project]
name = "vsl-backend"
version = "0.1.0"
description = "Local FastAPI backend for VSL Classroom Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Phase 1 runtime deps only. No onnxruntime / torch / mediapipe here until the
# phase that needs them (ADR-008, ADR-015, ADR-016).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",  # uvicorn needs a WebSocket implementation for /recognition/ws
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "platformdirs>=4.2",
    "psutil>=6",  # process RSS for diagnostics; RAM guard in P6
    "vsl-features",
]

[project.optional-dependencies]
# L3 server-side landmark extraction (ADR-002). Windows laptop only; never needed on the M1.
server-extraction = ["mediapipe>=1.1", "pillow>=11"]
# Phase 5 ONNX sign model (VSL_MODEL_MODE=onnx). Windows only; CPU (ADR-015).
onnx = ["onnxruntime>=1.20"]

[tool.uv.sources]
vsl-features = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
